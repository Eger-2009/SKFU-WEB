<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Структура вложенных div</title>
</head>
<body>

    <!-- КОРНЕВОЙ DIV (уровень 1) -->
    <!-- Этот div является РОДИТЕЛЕМ для двух div уровня 2 -->
    <div class="level-1"> 
        
        <!-- ПЕРВЫЙ ДОЧЕРНИЙ DIV (уровень 2) -->
        <!-- Родитель: div.level-1 -->
        <!-- Брат: второй div.level-2 -->
        <!-- Потомок: div.level-3 и <p> -->
        <div class="level-2">
            
            <!-- ВНУТРЕННИЙ DIV (уровень 3) -->
            <!-- Родитель: первый div.level-2 -->
            <!-- Потомок: <p>Потомок</p> -->
            <!-- Нет братьев (единственный дочерний элемент) -->
            <div class="level-3">
                
                <!-- ТЕГ <p> -->
                <!-- Родитель: div.level-3 -->
                <!-- Потомок корневого div (через цепочку вложенности) -->
                <!-- Нет братьев -->
                <p>Потомок</p>
                
            </div>
            
        </div>

        <!-- ВТОРОЙ ДОЧЕРНИЙ DIV (уровень 2) -->
        <!-- Родитель: div.level-1 -->
        <!-- Брат: первый div.level-2 -->
        <!-- Потомок: div.level-3 и <p> -->
        <div class="level-2">
            
            <!-- ВНУТРЕННИЙ DIV (уровень 3) -->
            <!-- Родитель: второй div.level-2 -->
            <!-- Потомок: <p>Потомок</p> -->
            <!-- Нет братьев (единственный дочерний элемент) -->
            <div class="level-3">
                
                <!-- ТЕГ <p> -->
                <!-- Родитель: div.level-3 -->
                <!-- Потомок корневого div (через цепочку вложенности) -->
                <!-- Нет братьев -->
                <p>Потомок</p>
                
            </div>
            
        </div>

    </div>

</body>
</html>
